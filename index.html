<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerGuide | 會員攻略發布系統 (含回覆功能)</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 0; }
        header { background-color: #1f1f1f; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #ffcc00; }
        h1 { color: #ffcc00; margin: 0; font-size: 24px; }
        
        .auth-panel { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #ffcc00; display: none; }
        .btn { padding: 8px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .login-btn { background-color: #4285F4; color: white; }
        .logout-btn { background-color: #d9534f; color: white; display: none; }

        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        
        /* 發文表單 */
        .post-box { background-color: #1f1f1f; padding: 25px; border-radius: 8px; margin-bottom: 40px; display: none; }
        .login-reminder { background-color: #222; text-align: center; padding: 30px; border-radius: 8px; border: 1px dashed #ffcc00; color: #aaa; margin-bottom: 40px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #aaa; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; box-sizing: border-box; background-color: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
        .form-group textarea { resize: vertical; min-height: 120px; }
        .submit-btn { background-color: #ffcc00; color: #121212; font-size: 16px; font-weight: bold; width: 100%; }

        /* 搜尋區塊 */
        .search-box { background-color: #1f1f1f; padding: 15px 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        .search-box label { font-weight: bold; color: #ffcc00; white-space: nowrap; }
        .search-box input { flex: 1; padding: 10px; background-color: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }

        /* 文章列表 */
        .guide-post { background-color: #1f1f1f; padding: 20px; border-radius: 8px; margin-bottom: 20px; position: relative; border-left: 4px solid #ffcc00; }
        .guide-post h3 { margin: 0 0 10px 0; color: #fff; }
        .meta { font-size: 13px; color: #888; margin-bottom: 15px; }
        .meta span { margin-right: 15px; background: #333; padding: 3px 8px; border-radius: 4px; }
        .post-content { white-space: pre-wrap; margin-bottom: 20px; }
        
        .video-wrapper { max-width: 480px; margin: 15px 0 20px 0; border-radius: 6px; overflow: hidden; background: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .post-video { width: 100%; height: 270px; display: block; border: none; }

        .qa-section { margin-top: 15px; background-color: #151515; border: 1px solid #333; border-radius: 6px; overflow: hidden; margin-bottom: 20px; }
        .qa-toggle-btn { background-color: #2a2a2a; color: #ffcc00; width: 100%; text-align: left; padding: 12px 15px; font-weight: bold; border: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .qa-toggle-btn:hover { background-color: #333; }
        .qa-content { display: none; padding: 15px; border-top: 1px solid #222; background-color: #1a1a1a; }
        
        .qa-q { font-weight: bold; color: #4285F4; margin-bottom: 12px; font-size: 15px; }
        .qa-a-wrapper { display: flex; align-items: flex-start; gap: 8px; }
        .qa-a { color: #ddd; white-space: pre-wrap; padding-left: 5px; border-left: 2px solid #5cb85c; flex: 1; }
        
        .author-badge { background-color: #5cb85c; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 3px; font-weight: bold; white-space: nowrap; margin-top: 2px; }

        /* 留言區 */
        .comment-section { border-top: 1px solid #333; padding-top: 20px; margin-top: 25px; }
        .comment-title { font-size: 16px; color: #ffcc00; margin-bottom: 15px; font-weight: bold; }
        .comment-list { display: flex; flex-direction: column; gap: 12px; max-height: 450px; overflow-y: auto; margin-bottom: 15px; padding-right: 5px; }
        
        /* 留言外殼（含回覆排版） */
        .comment-group { display: flex; flex-direction: column; gap: 8px; }
        
        .comment-item { background: #181818; padding: 10px 12px; border-radius: 6px; border: 1px solid #252525; display: flex; gap: 10px; align-items: flex-start; position: relative; }
        .comment-avatar { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #444; }
        .comment-body { flex: 1; padding-right: 110px; } /* 寬度稍微加寬容納三個按鈕 */
        .comment-header { font-size: 12px; color: #888; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .comment-user { font-weight: bold; color: #aaa; }
        .comment-text { font-size: 14px; color: #ddd; white-space: pre-wrap; }

        /* 子回覆縮進樣式 */
        .reply-item { margin-left: 35px; background: #141414; border-left: 2px solid #444; border-radius: 0 6px 6px 0; }

        /* 無底色功能按鈕組 */
        .comment-actions { position: absolute; top: 10px; right: 12px; display: flex; gap: 8px; }
        .comment-action-btn { background: none; border: none; padding: 0; font-size: 12px; font-weight: bold; cursor: pointer; transition: color 0.2s; }
        .c-reply-btn { color: #4285F4; }
        .c-reply-btn:hover { color: #70a5ff; text-decoration: underline; }
        .c-edit-btn { color: #5cb85c; }
        .c-edit-btn:hover { color: #85e085; text-decoration: underline; }
        .c-delete-btn { color: #d9534f; }
        .c-delete-btn:hover { color: #ff736e; text-decoration: underline; }

        /* 動態回覆輸入框外殼 */
        .reply-form-wrapper { margin-left: 35px; margin-top: 2px; margin-bottom: 5px; display: none; }

        /* 留言與回覆共用輸入框底層 */
        .comment-form, .reply-form { display: flex; gap: 10px; }
        .comment-input, .reply-input { flex: 1; padding: 8px 12px; background-color: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 14px; }
        .comment-submit-btn, .reply-submit-btn { background-color: #ffcc00; color: #121212; padding: 8px 15px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; white-space: nowrap; border: none; }
        .comment-login-tip { font-size: 13px; color: #666; font-style: italic; text-align: center; background: #161616; padding: 8px; border-radius: 4px; }

        /* 主文章按鈕 */
        .action-group { position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; }
        .edit-btn { background-color: #5cb85c; color: white; display: none; }
        .delete-btn { background-color: #d9534f; color: white; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>GamerGuide 玩家創作區</h1>
        <div class="auth-panel">
            <img id="userAvatar" class="user-avatar" src="" alt="頭像">
            <span id="userName" style="display:none;"></span>
            <button id="loginBtn" class="btn login-btn">使用 Google 登入</button>
            <button id="logoutBtn" class="btn logout-btn">登出</button>
        </div>
    </header>

    <div class="container">
        <div id="loginReminder" class="login-reminder">
            <h3>請先登入 Google 帳號，即可發表或編輯攻略文章！</h3>
        </div>

        <section id="postBox" class="post-box">
            <h2 id="formTitle">📝 撰寫新攻略</h2>
            <form id="guideForm">
                <input type="hidden" id="editingPostId"> 
                
                <div class="form-group">
                    <label for="gameName">遊戲名稱：</label>
                    <input type="text" id="gameName" required>
                </div>
                <div class="form-group">
                    <label for="title">攻略標題：</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label for="content">攻略內容：</label>
                    <textarea id="content" required></textarea>
                </div>
                <div class="form-group">
                    <label for="videoUrl">影片網址連結 (選填)：</label>
                    <input type="url" id="videoUrl" placeholder="請貼上影片連結 (支援 MP4、WebM 或 YouTube 網址)">
                </div>

                <div style="background: #252525; padding: 15px; border-radius: 6px; margin-bottom: 15px; border-left: 3px solid #5cb85c;">
                    <h4 style="margin: 0 0 10px 0; color: #5cb85c;">❓ 常見問與答 (選填)</h4>
                    <div class="form-group">
                        <label for="qaQuestion">常見問題 (Q)：</label>
                        <input type="text" id="qaQuestion" placeholder="例如：這關的新手防具要去哪裡拿？">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="qaAnswer">詳細解答 (A)：</label>
                        <textarea id="qaAnswer" placeholder="例如：在第一章村莊左側的老鐵匠家後方寶箱內..." style="min-height: 80px;"></textarea>
                    </div>
                </div>

                <button type="submit" id="formSubmitBtn" class="btn submit-btn">發布攻略</button>
                <button type="button" id="cancelEditBtn" class="btn" style="background:#555; color:#fff; width:100%; margin-top:10px; display:none;">取消編輯</button>
            </form>
        </section>

        <section class="article-feed">
            <div class="search-box">
                <label for="searchGame">🔍 搜尋遊戲：</label>
                <input type="text" id="searchGame" placeholder="輸入遊戲名稱關鍵字...">
            </div>

            <h2>🔥 最新玩家攻略</h2>
            <div id="postsContainer"></div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC1f_sypRrrpUKym4VdySlriFb_WGP64s0",
            authDomain: "project-78ab8.firebaseapp.com",
            projectId: "project-78ab8",
            storageBucket: "project-78ab8.firebasestorage.app",
            messagingSenderId: "385214699225",
            appId: "1:385214699225:web:2150c4809616e6321490c8",
            measurementId: "G-62ZWJ9JLJD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null; 
        let allPosts = []; 
        let commentsListeners = {}; 

        // === 1. 登入/登出邏輯 ===
        document.getElementById('loginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(err => console.error("彈窗登入失敗:", err));
        });
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('loginReminder').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
                document.getElementById('userAvatar').src = user.photoURL;
                document.getElementById('userAvatar').style.display = 'block';
                document.getElementById('postBox').style.display = 'block';
            } else {
                currentUser = null;
                document.getElementById('loginBtn').style.display = 'block';
                document.getElementById('loginReminder').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('userAvatar').style.display = 'none';
                document.getElementById('postBox').style.display = 'none';
                resetForm();
            }
            renderPosts(); 
        });

        function formatVideoEmbed(url) {
            if (!url) return '';
            const youtubeRegex = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(youtubeRegex);
            if (match && match[2].length === 11) {
                const youtubeId = match[2];
                return `<div class="video-wrapper"><iframe class="post-video" src="https://www.youtube.com/embed/${youtubeId}" allowfullscreen></iframe></div>`;
            } else {
                return `<div class="video-wrapper"><video class="post-video" src="${url}" controls preload="metadata"></video></div>`;
            }
        }

        function formatQASection(q, a) {
            if (!q || !a) return ''; 
            return `
                <div class="qa-section">
                    <button class="qa-toggle-btn">
                        <span>💡 常見問與答 (點擊展開)</span>
                        <span>▼</span>
                    </button>
                    <div class="qa-content">
                        <div class="qa-q">Q: ${q}</div>
                        <div class="qa-a-wrapper">
                            <span class="author-badge">作者回覆</span>
                            <div class="qa-a">${a}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // === 2. 發布或儲存編輯攻略 ===
        const form = document.getElementById('guideForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return alert('請先登入！');

            const gameName = document.getElementById('gameName').value.trim();
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value;
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const qaQuestion = document.getElementById('qaQuestion').value.trim();
            const qaAnswer = document.getElementById('qaAnswer').value.trim();
            const editingId = document.getElementById('editingPostId').value;

            try {
                if (editingId) {
                    const postRef = doc(db, "guides", editingId);
                    await updateDoc(postRef, { gameName, title, content, videoUrl, qaQuestion, qaAnswer });
                    alert('📝 攻略修改成功！');
                    resetForm();
                } else {
                    await addDoc(collection(db, "guides"), {
                        gameName, title, content, videoUrl, qaQuestion, qaAnswer,
                        userId: currentUser.uid, 
                        author: currentUser.displayName,
                        timestamp: new Date()
                    });
                    alert('🎉 攻略發表成功！');
                    resetForm();
                }
            } catch (error) {
                console.error(error);
            }
        });

        // === 3. 即時同步下載資料與渲染 ===
        function initPostsListener() {
            const q = query(collection(db, "guides"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                Object.values(commentsListeners).forEach(unsub => unsub());
                commentsListeners = {};
                allPosts = []; 
                snapshot.forEach((doc) => {
                    allPosts.push({ id: doc.id, ...doc.data() });
                });
                renderPosts(); 
            });
        }

        function renderPosts() {
            const postsContainer = document.getElementById('postsContainer');
            postsContainer.innerHTML = ''; 

            const keyword = document.getElementById('searchGame').value.toLowerCase().trim();
            const filteredPosts = allPosts.filter(post => {
                const gameName = post.gameName ? post.gameName.toLowerCase() : '';
                return gameName.includes(keyword);
            });

            if (filteredPosts.length === 0) {
                postsContainer.innerHTML = `<p style="color: #888; text-align: center; margin-top: 20px;">找不到符合該遊戲名稱的攻略 😭</p>`;
                return;
            }

            filteredPosts.forEach((data) => {
                const postEl = document.createElement('article');
                postEl.classList.add('guide-post');
                
                const showBtn = currentUser && currentUser.uid === data.userId ? 'inline-block' : 'none';
                const videoHtml = formatVideoEmbed(data.videoUrl);
                const qaHtml = formatQASection(data.qaQuestion, data.qaAnswer);

                postEl.innerHTML = `
                    <h3>${data.title}</h3>
                    <div class="meta">
                        <span>遊戲：${data.gameName}</span> 
                        <span>作者：${data.author}</span> 
                    </div>
                    <p class="post-content">${data.content}</p>
                    ${videoHtml}
                    ${qaHtml}
                    
                    <div class="comment-section">
                        <div class="comment-title">💬 玩家討論區</div>
                        <div class="comment-list" id="comments-${data.id}">
                            <p style="color:#666; font-size:13px;">載入留言中...</p>
                        </div>
                        ${currentUser ? `
                            <form class="comment-form" data-postid="${data.id}">
                                <input type="text" class="comment-input" placeholder="說點什麼吧..." required>
                                <button type="submit" class="comment-submit-btn">留言</button>
                            </form>
                        ` : `
                            <div class="comment-login-tip">請先於上方登入帳號，即可參與討論。</div>
                        `}
                    </div>

                    <div class="action-group">
                        <button class="btn edit-btn" style="display:${showBtn}" data-id="${data.id}">編輯</button>
                        <button class="btn delete-btn" style="display:${showBtn}" data-id="${data.id}">刪除</button>
                    </div>
                `;
                postsContainer.appendChild(postEl);
                initCommentsListener(data.id, data.userId);
            });

            document.querySelectorAll('.qa-toggle-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const currentBtn = e.currentTarget;
                    const qaContent = currentBtn.nextElementSibling;
                    const arrow = currentBtn.querySelector('span:last-child');
                    if (qaContent.style.display === 'block') {
                        qaContent.style.display = 'none';
                        arrow.textContent = '▼';
                    } else {
                        qaContent.style.display = 'block';
                        arrow.textContent = '▲';
                    }
                });
            });

            document.querySelectorAll('.comment-form').forEach(cForm => {
                cForm.addEventListener('submit', handleCommentSubmit);
            });

            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => startEdit(e.target.getAttribute('data-id')));
            });
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => handleDelete(e.target.getAttribute('data-id')));
            });
        }

        // === 4. 子留言即時監聽與進階權限控制 (整合回覆架構) ===
        function initCommentsListener(postId, authorId) {
            const commentsRef = collection(db, "guides", postId, "comments");
            const q = query(commentsRef, orderBy("timestamp", "asc"));

            commentsListeners[postId] = onSnapshot(q, (snapshot) => {
                const commentListEl = document.getElementById(`comments-${postId}`);
                if (!commentListEl) return;

                if (snapshot.empty) {
                    commentListEl.innerHTML = `<p style="color:#666; font-size:13px; font-style:italic; margin:5px 0;">目前還沒有人留言，快來當第一個！</p>`;
                    return;
                }

                commentListEl.innerHTML = '';
                
                // 為了處理回覆功能，我們在前端做分流：一級常規留言 vs 二級子回覆留言
                const mainComments = [];
                const replies = [];

                snapshot.forEach((doc) => {
                    const item = { id: doc.id, ...doc.data() };
                    if (item.parentId) {
                        replies.push(item);
                    } else {
                        mainComments.push(item);
                    }
                });

                // 開始畫留言
                mainComments.forEach((cData) => {
                    const commentGroup = document.createElement('div');
                    commentGroup.classList.add('comment-group');

                    // 1. 產生一級留言的 HTML
                    commentGroup.innerHTML = createCommentHtml(cData, postId, authorId, false);
                    
                    // 2. 篩選出屬於該留言的所有子回覆，並塞入外殼中
                    const childReplies = replies.filter(r => r.parentId === cData.id);
                    childReplies.forEach((rData) => {
                        commentGroup.innerHTML += createCommentHtml(rData, postId, authorId, true);
                    });

                    // 3. 補上給一級留言動態生成的「隱藏回覆框」
                    if (currentUser) {
                        commentGroup.innerHTML += `
                            <div class="reply-form-wrapper" id="reply-box-${cData.id}">
                                <form class="reply-form" data-postid="${postId}" data-parentid="${cData.id}">
                                    <input type="text" class="reply-input" placeholder="回覆 @${cData.userName}..." required>
                                    <button type="submit" class="reply-submit-btn">送出</button>
                                </form>
                            </div>
                        `;
                    }

                    commentListEl.appendChild(commentGroup);
                });

                // 綁定所有無底色功能按鈕事件
                commentListEl.querySelectorAll('.c-reply-btn').forEach(b => b.addEventListener('click', toggleReplyBox));
                commentListEl.querySelectorAll('.c-edit-btn').forEach(b => b.addEventListener('click', handleCommentEdit));
                commentListEl.querySelectorAll('.c-delete-btn').forEach(b => b.addEventListener('click', handleCommentDelete));
                
                // 綁定二級回覆表單提交
                commentListEl.querySelectorAll('.reply-form').forEach(rForm => rForm.addEventListener('submit', handleReplySubmit));
                
                commentListEl.scrollTop = commentListEl.scrollHeight;
            });
        }

        // 獨立輔助函式：動態組合留言/回覆的 HTML 區塊
        function createCommentHtml(cData, postId, authorId, isReply) {
            const isAuthorOfPost = cData.userId === authorId;
            const authorTagHtml = isAuthorOfPost ? `<span class="author-badge" style="padding:1px 4px; font-size:10px;">作者</span>` : '';
            const timeString = cData.timestamp ? new Date(cData.timestamp.toDate()).toLocaleString('zh-TW', {hour12:false}) : '剛才';

            const isMe = currentUser && currentUser.uid === cData.userId;
            const amIArticleAuthor = currentUser && currentUser.uid === authorId;
            
            // 檢查 5 分鐘時限
            let isWithinFiveMinutes = false;
            if (cData.timestamp) {
                const commentTime = cData.timestamp.toDate().getTime();
                const nowTime = new Date().getTime();
                isWithinFiveMinutes = (nowTime - commentTime) < 300000; 
            } else {
                isWithinFiveMinutes = true;
            }

            // 👑 權限核心修改：
            // 編輯按鈕：只有【留言者自己】且【在5分鐘內】才能編輯（攻略作者不能編輯他人留言）
            const canEdit = isMe && isWithinFiveMinutes;
            // 刪除按鈕：【留言者自己】或【攻略作者】隨時都能刪除
            const canDelete = isMe || amIArticleAuthor;

            let actionsHtml = `<div class="comment-actions">`;
            // 只有「主留言」右側才放「回覆」按鈕，避免無限套娃
            if (currentUser && !isReply) {
                actionsHtml += `<button class="comment-action-btn c-reply-btn" data-commentid="${cData.id}">回覆</button>`;
            }
            if (canEdit) {
                actionsHtml += `<button class="comment-action-btn c-edit-btn" data-postid="${postId}" data-commentid="${cData.id}" data-text="${cData.text.replace(/"/g, '&quot;')}">編輯</button>`;
            }
            if (canDelete) {
                actionsHtml += `<button class="comment-action-btn c-delete-btn" data-postid="${postId}" data-commentid="${cData.id}">刪除</button>`;
            }
            actionsHtml += `</div>`;

            return `
                <div class="comment-item ${isReply ? 'reply-item' : ''}">
                    <img class="comment-avatar" src="${cData.userAvatar || 'https://www.gravatar.com/avatar/?d=mp'}" alt="avatar">
                    <div class="comment-body">
                        <div class="comment-header">
                            <span class="comment-user">${cData.userName}</span>
                            ${authorTagHtml}
                            <span>• ${timeString}</span>
                        </div>
                        <div class="comment-text">${cData.text}</div>
                    </div>
                    ${actionsHtml}
                </div>
            `;
        }

        // 控制回覆輸入框顯示或隱藏
        function toggleReplyBox(e) {
            const commentId = e.target.getAttribute('data-commentid');
            const box = document.getElementById(`reply-box-${commentId}`);
            if (!box) return;
            box.style.display = (box.style.display === 'block') ? 'none' : 'block';
            if (box.style.display === 'block') {
                box.querySelector('.reply-input').focus();
            }
        }

        // === 5. 新增/回覆/修改/刪除留言運作函式 ===
        async function handleCommentSubmit(e) {
            e.preventDefault();
            if (!currentUser) return alert('請先登入帳號！');

            const targetForm = e.currentTarget;
            const postId = targetForm.getAttribute('data-postid');
            const inputEl = targetForm.querySelector('.comment-input');
            const text = inputEl.value.trim();

            if (!text) return;

            try {
                const commentsRef = collection(db, "guides", postId, "comments");
                await addDoc(commentsRef, {
                    text: text,
                    userId: currentUser.uid,
                    userName: currentUser.displayName,
                    userAvatar: currentUser.photoURL,
                    timestamp: new Date()
                    // parentId 留空，代表這是一級主要留言
                });
                inputEl.value = '';
            } catch (error) {
                console.error(error);
            }
        }

        async function handleReplySubmit(e) {
            e.preventDefault();
            if (!currentUser) return alert('請先登入帳號！');

            const targetForm = e.currentTarget;
            const postId = targetForm.getAttribute('data-postid');
            const parentId = targetForm.getAttribute('data-parentid');
            const inputEl = targetForm.querySelector('.reply-input');
            const text = inputEl.value.trim();

            if (!text) return;

            try {
                const commentsRef = collection(db, "guides", postId, "comments");
                await addDoc(commentsRef, {
                    text: text,
                    userId: currentUser.uid,
                    userName: currentUser.displayName,
                    userAvatar: currentUser.photoURL,
                    timestamp: new Date(),
                    parentId: parentId // 帶上父級留言 ID，標記為二級回覆
                });
                inputEl.value = '';
                document.getElementById(`reply-box-${parentId}`).style.display = 'none'; // 送出後自動收合
            } catch (error) {
                console.error(error);
            }
        }

        async function handleCommentEdit(e) {
            const postId = e.target.getAttribute('data-postid');
            const commentId = e.target.getAttribute('data-commentid');
            const oldText = e.target.getAttribute('data-text');

            const newText = prompt("✏️ 請輸入修改後的內容：", oldText);
            if (newText === null) return; 
            if (!newText.trim()) return alert("內容不能為空！");

            try {
                const commentRef = doc(db, "guides", postId, "comments", commentId);
                await updateDoc(commentRef, { text: newText.trim() });
                alert("📝 修改成功！");
            } catch (error) {
                alert("修改失敗，可能已超過 5 分鐘時限。");
            }
        }

        async function handleCommentDelete(e) {
            if (!confirm("🗑️ 確定要刪除這條訊息嗎？（注意：若為主留言，其下方的回覆也將一併不再連動顯示）")) return;

            const postId = e.target.getAttribute('data-postid');
            const commentId = e.target.getAttribute('data-commentid');

            try {
                const commentRef = doc(db, "guides", postId, "comments", commentId);
                await deleteDoc(commentRef);
                alert("🗑️ 已成功刪除！");
            } catch (error) {
                alert("刪除失敗，權限不足。");
            }
        }

        document.getElementById('searchGame').addEventListener('input', renderPosts);

        // === 6. 主文章控制 ===
        function startEdit(id) {
            const postData = allPosts.find(p => p.id === id);
            if (!postData) return;
            
            document.getElementById('gameName').value = postData.gameName || '';
            document.getElementById('title').value = postData.title || '';
            document.getElementById('content').value = postData.content || '';
            document.getElementById('videoUrl').value = postData.videoUrl || '';
            document.getElementById('qaQuestion').value = postData.qaQuestion || '';
            document.getElementById('qaAnswer').value = postData.qaAnswer || '';

            document.getElementById('editingPostId').value = id;
            document.getElementById('formTitle').textContent = "✏️ 編輯我的攻略";
            document.getElementById('formSubmitBtn').textContent = "儲存修改";
            document.getElementById('cancelEditBtn').style.display = "block";
            
            window.scrollTo({ top: document.getElementById('postBox').offsetTop, behavior: 'smooth' });
        }

        async function handleDelete(id) {
            if (confirm('確定要刪除這篇攻略嗎？此操作無法復原。')) {
                try {
                    await deleteDoc(doc(db, "guides", id));
                    alert('🗑️ 攻略已成功刪除！');
                    if(document.getElementById('editingPostId').value === id) {
                        resetForm();
                    }
                } catch (error) {
                    console.error(error);
                }
            }
        }

        document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

        function resetForm() {
            form.reset();
            document.getElementById('editingPostId').value = '';
            document.getElementById('formTitle').textContent = "📝 撰寫新攻略";
            document.getElementById('formSubmitBtn').textContent = "發布攻略";
            document.getElementById('cancelEditBtn').style.display = "none";
        }

        initPostsListener();
    </script>
</body>
</html>
